name: Deployer le site statique

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permissions necessaires pour GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evite les deployments concurrents
concurrency: pages

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dependances
        run: npm ci

      - name: Build du site
        run: npm run build

      - name: Upload artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploiement
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployer vers GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
